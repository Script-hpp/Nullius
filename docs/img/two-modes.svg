<g role="img" aria-label="Paper and authors' code, Shchur GAT: matched"><circle class="ok" cx="638" cy="214" r="15"/><path class="tick" d="M632 214 l4.5 5 l8 -10"/></g>
<g role="img" aria-label="Paper and authors' code, Veličković GAT: matched"><circle class="ok" cx="712" cy="214" r="15"/><path class="tick" d="M706 214 l4.5 5 l8 -10"/></g>
<g role="img" aria-label="Paper and authors' code, DGI: matched"><circle class="ok" cx="786" cy="214" r="15"/><path class="tick" d="M780 214 l4.5 5 l8 -10"/></g>
<text class="big" x="884" y="222" text-anchor="middle">7 of 8</text>
<line class="ln" x1="28" x2="952" y1="258" y2="258"/>
<text class="rl" x="28" y="292">Held-out and controls</text><text class="rs m" x="28" y="310">RLinear was not used</text><text class="rs m" x="28" y="326">to design the fixes</text>
<g role="img" aria-label="Held-out RLinear, paper and authors' code: missed"><circle class="miss" cx="268" cy="294" r="15"/><path class="dash" d="M263 294 h10"/></g>
<text class="rs" x="296" y="299">RLinear 0 of 1 (0.487 and 0.432 against a target of 0.366)</text>
<text class="rs" x="296" y="324">Placebo claims confirmed as reproduced: 0 of 9 (v4: 0 of 48)</text>
<text class="fn w" x="28" y="364">Read with care: in-sample (fixes were designed after seeing these units), different mode and models, never added to the v4 count.</text>
<text class="fn m" x="28" y="382">Method fidelity not checked. Three units were decided only by a third generation; one (NLinear) flipped to a miss.</text>
</svg>