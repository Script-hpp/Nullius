<text class="h m" x="490" y="72">Zeng</text>
<text class="h m" x="490" y="88">NLinear</text>
<text class="h m" x="564" y="72">Shchur</text>
<text class="h m" x="564" y="88">GCN</text>
<text class="h m" x="638" y="72">Shchur</text>
<text class="h m" x="638" y="88">GAT</text>
