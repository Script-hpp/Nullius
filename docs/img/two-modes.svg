<text class="h m" x="786" y="72">DGI</text>
<line class="ln" x1="28" x2="952" y1="100" y2="100"/>
<text class="rl" x="28" y="128">Paper only</text><text class="rs m" x="28" y="144">benchmark v4, with Tavily (stored)</text><text class="rs m" x="28" y="160">majority of 3 generations</text>
<g role="img" aria-label="Paper only, Kipf GCN: matched"><circle class="ok" cx="268" cy="138" r="15"/><path class="tick" d="M262 138 l4.5 5 l8 -10"/></g>
