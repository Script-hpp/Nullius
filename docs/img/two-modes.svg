<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Eight paper-claim units: matches with the reference verdict, paper only versus paper and authors' code</title>
<desc id="d">Paper-only rebuild (benchmark v4, with Tavily): 2 of 8 units match the reference verdict. Paper and authors' code (recall cg v1): 7 of 8 development units match; the held-out paper RLinear misses (0 of 1). In-sample result, different mode and models, never added to the v4 count.</desc>
<style>
:root{--fg:#1c1a17;--mut:#6b655c;--line:#d9d3c7;--bg:#f7f3ea;--ok:#0f7a5c;--miss:#9a9388;--warn:#b4570f}
@media (prefers-color-scheme:dark){:root{--fg:#ece8df;--mut:#a39d91;--line:#3a3731;--bg:#141311;--ok:#34c79b;--miss:#7b756a;--warn:#e0913f}}
.bg{fill:var(--bg)} text{fill:var(--fg)} .m{fill:var(--mut)} .w{fill:var(--warn)} .ln{stroke:var(--line);stroke-width:1}
.ok{fill:var(--ok)} .tick{fill:none;stroke:var(--bg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.miss{fill:none;stroke:var(--miss);stroke-width:1.6} .dash{stroke:var(--miss);stroke-width:1.6;stroke-linecap:round}
.h{font-size:12.5px;text-anchor:middle} .rl{font-size:14px;font-weight:600} .rs{font-size:12px} .big{font-size:24px;font-weight:700} .fn{font-size:12px}
</style>
<rect class="bg" width="980" height="400" rx="10"/>
<text x="28" y="36" font-size="15" font-weight="700">Same eight units, two modes: matches with the reference verdict</text>
<text class="h m" x="268" y="72">Kipf</text>
<text class="h m" x="268" y="88">GCN</text>
<text class="h m" x="342" y="72">Wu</text>
