[project]
name = "repro-agent"
version = "0.1.0"
description = "Paper reproduction agent: the paper is the test suite"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Script-hpp", email = "onuralpag2a@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "contree-sdk>=0.3.6",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tavily-python>=0.8.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
repro-agent = "repro_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
]
