<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4f4f5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E@media (prefers-color-scheme: light) %7B svg %7B stroke: %2318181b %7D %7D%3C/style%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E" />
    <script>
      // Set the theme before first paint (no flash). Same key and logic as src/theme.ts.
      (function () {
        var pref = 'system'
        try { var v = localStorage.getItem('nullius-theme'); if (v === 'light' || v === 'dark' || v === 'system') pref = v } catch (e) {}
        var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <title>Paper Reproduction Evidence</title>
    <meta name="description" content="Replay of paper reproduction runs: what Tavily found, what the sandbox measured." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
