<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // Set the theme before first paint (no flash). Same key and logic as src/theme.ts.
      (function () {
        var pref = 'system'
        try { var v = localStorage.getItem('nullius-theme'); if (v === 'light' || v === 'dark' || v === 'system') pref = v } catch (e) {}
        var theme = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <style>
      /* Critical CSS: background matches the theme before the main stylesheet loads (values from --c-bg in src/index.css). */
      html, body { margin: 0; background: #0b0a09; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f5f1e8; }
    </style>
    <title>Paper Reproduction Evidence</title>
    <meta name="description" content="Replay of paper reproduction runs: what Tavily found, what the sandbox measured." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
