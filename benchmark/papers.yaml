# Benchmark-Kandidaten. Zielwerte direkt aus Papers uebernehmen, nicht aus Gedaechtnis. TODO Meilenstein 4.
papers:
  - id: kipf_gcn_2017
    title: "Semi-Supervised Classification with Graph Convolutional Networks"
    arxiv_url: "https://arxiv.org/abs/1609.02907"
    dataset: "Cora"
    expectation: "reproduziert"
    seeds: 10   # pro Task festgelegt: GCN ~25 s pro Seed; teurere Experimente weniger
    claims:
      # TODO: Zielwert gegen Tabelle 2 im Paper pruefen (spaeter via Tavily Rolle 2 automatisch).
      - id: gcn_cora_acc
        text: "GCN erreicht 81,5 % Accuracy auf Cora (Standard-Split)"
        metric: accuracy
        target: 0.815
        tolerance: 0.01   # feste Regel: +-1 Prozentpunkt bei Accuracy
        source: "Tabelle 2, arXiv v1"

  - id: shchur_pitfalls_2018
    title: "Pitfalls of Graph Neural Network Evaluation"
    arxiv_url: "https://arxiv.org/abs/1811.05868"
    dataset: "Cora, Citeseer"
    expectation: "Ranking haengt vom Split ab"

  - id: zeng_dlinear_2023
    title: "Are Transformers Effective for Time Series Forecasting?"
    arxiv_url: "https://arxiv.org/abs/2205.13504"
    dataset: "ETTh1"
    expectation: "reproduziert"

  - id: dacrema_progress_2019
    title: "Are We Really Making Much Progress? A Worrying Analysis of Recent Neural Recommendation Approaches"
    arxiv_url: "https://arxiv.org/abs/1907.06902"
    dataset: "MovieLens"
    expectation: "Baselines schlagen neuronale Modelle"

  - id: shwartz_ziv_tabular_2021
    title: "Tabular Data: Deep Learning is Not All You Need"
    arxiv_url: "https://arxiv.org/abs/2106.03253"
    dataset: "kleine Tabellen-Datensaetze"
    expectation: "XGBoost vorn"
