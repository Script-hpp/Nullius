# Benchmark-Kandidaten. Zielwerte direkt aus Papers uebernehmen, nicht aus Gedaechtnis. TODO Meilenstein 4.
papers:
  - id: kipf_gcn_2017
    title: "Semi-Supervised Classification with Graph Convolutional Networks"
    arxiv_url: "https://arxiv.org/abs/1609.02907"
    dataset: "Cora"
    expectation: "reproduziert"
    fidelity:   # Methodentreue-Pruefung: Bausteine werden einmal aus dem Paper extrahiert und eingefroren
      method: "Graph Convolutional Network (GCN) for semi-supervised node classification"
      keywords: ["renormalization trick", "layer-wise propagation", "two-layer", "graph convolution"]
    seeds: 10   # pro Task festgelegt: GCN ~25 s pro Seed; teurere Experimente weniger
    claims:
      # TODO: Zielwert gegen Tabelle 2 im Paper pruefen (spaeter via Tavily Rolle 2 automatisch).
      - id: gcn_cora_acc
        text: "GCN erreicht 81,5 % Accuracy auf Cora (Standard-Split)"
        metric: accuracy
        target: 0.815
        tolerance: 0.01   # feste Regel: +-1 Prozentpunkt bei Accuracy
        source: "manuell (Gedaechtnis, ungeprueft)"   # ohne Tavily; mit Tavily wird target/source ersetzt
        extract: {method: "GCN (this paper)", dataset: "Cora", metric: "accuracy"}

  - id: shchur_pitfalls_2018
    title: "Pitfalls of Graph Neural Network Evaluation"
    arxiv_url: "https://arxiv.org/abs/1811.05868"
    dataset: "Cora, Citeseer"
    expectation: "Ranking haengt vom Split ab"

  - id: zeng_dlinear_2023
    title: "Are Transformers Effective for Time Series Forecasting?"
    arxiv_url: "https://arxiv.org/abs/2205.13504"
    dataset: "ETTh1"
    expectation: "reproduziert"
    fidelity:
      method: "DLinear (decomposition linear model for long-term time series forecasting)"
      keywords: ["DLinear", "moving average", "decomposition"]
    seeds: 5
    claims:
      # Zielwerte manuell (ohne Tavily) aus Table 2, ungeprueft; mit Tavily belegt ersetzt.
      # Toleranz vorab festgelegt: paper nennt keine Streuung im Haupttext -> feste Regel 0,01 absolut.
      - id: dlinear_etth1_96_mse
        text: "DLinear erreicht MSE 0,375 auf ETTh1 bei Vorhersagehorizont 96 (Eingabefenster 336)"
        metric: mse
        target: 0.375
        tolerance: 0.01
        source: "manuell (Gedaechtnis, ungeprueft)"
        extract: {method: "DLinear", dataset: "ETTh1", metric: "MSE for prediction length 96", percent: false}
      - id: dlinear_etth1_96_mae
        text: "DLinear erreicht MAE 0,399 auf ETTh1 bei Vorhersagehorizont 96 (Eingabefenster 336)"
        metric: mae
        target: 0.399
        tolerance: 0.01
        source: "manuell (Gedaechtnis, ungeprueft)"
        extract: {method: "DLinear", dataset: "ETTh1", metric: "MAE for prediction length 96", percent: false}

  - id: dacrema_progress_2019
    title: "Are We Really Making Much Progress? A Worrying Analysis of Recent Neural Recommendation Approaches"
    arxiv_url: "https://arxiv.org/abs/1907.06902"
    dataset: "MovieLens"
    expectation: "Baselines schlagen neuronale Modelle"

  - id: shwartz_ziv_tabular_2021
    title: "Tabular Data: Deep Learning is Not All You Need"
    arxiv_url: "https://arxiv.org/abs/2106.03253"
    dataset: "kleine Tabellen-Datensaetze"
    expectation: "XGBoost vorn"
