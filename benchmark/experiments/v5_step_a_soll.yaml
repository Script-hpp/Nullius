# Soll-Liste v5 Schritt A (Inhalt wörtlich aus benchmark/experiments/v5_step_a.md, Vorab-Festlegung, final) plus feste Auswertungsmuster.
# Nur für die Auswertung (scripts/measure_setup_fidelity.py); nie in einem Prompt oder im src/-Code.
#
# patterns.<unit>.<punkt>:
#   topic:  Regex auf "Thema + Wert" der Angabe (case-insensitive); trifft sie, ist das Thema getroffen.
#   value:  Regex auf den Wert (case-insensitive); trifft sie, gilt die Angabe als korrekt.
#   wrong:  optional, Regex auf den Wert; trifft sie (und value nicht), gilt die Angabe als falsch.
# Thema getroffen, weder value noch wrong: Zweifelsfall (Handprüfung durch den Reviewer, zählt nicht als korrekt).
# misleading.<unit>: Regex auf die Zeilen des Plan-Textes (format_for_prompt + Konflikte); Zeile gilt als "irreführend als gültig",
#   wenn `line` trifft und `unless` nicht (Markierung "optional advice", "repository default", "applies to other ..." usw.).

units:
  kipf_gcn_2017: {claim: gcn_cora_acc}
  wu_sgc_2019: {claim: sgc_cora_acc}
  velickovic_gat_2018: {claim: gat_cora_acc}
  velickovic_dgi_2019: {claim: dgi_cora_acc}
  shchur_pitfalls_2018: {claim: shchur_gcn_cora_acc}
  shchur_gat_2018: {claim: shchur_gat_cora_acc}
  zeng_dlinear_2023: {claim: dlinear_etth1_96_mse}
  zeng_nlinear_2023: {claim: nlinear_etth1_96_mse}

soll:
  kipf_gcn_2017:
    feature_norm: "Merkmale zeilennormalisiert"
    adj_norm: "D^-1/2 (A+I) D^-1/2"
    lr: 0.01
    weight_decay: "5e-4, nur erste Schicht"
    dropout: 0.5
    hidden: 16
    epochs: 200
    early_stopping: "Validierungsloss, Fenster 10"
  wu_sgc_2019:
    feature_norm: "Merkmale zeilennormalisiert (nicht standardisiert)"
    adj_norm: "D^-1/2 (A+I) D^-1/2, K = 2"
    lr: 0.2
    epochs: 100
    weight_decay: "auf Validierung gesucht (hyperopt), kein fester Wert"
  velickovic_gat_2018:
    feature_norm: "Merkmale zeilennormalisiert"
    lr: 0.005
    weight_decay: "L2 5e-4"
    dropout: "0.6 auf Eingaben und Attention"
    hidden: "8 Köpfe x 8 Merkmale, Ausgabe 1 Kopf"
    early_stopping: "Validierungsloss und -accuracy, Geduld 100"
  velickovic_dgi_2019:
    feature_norm: "Merkmale zeilennormalisiert"
    encoder: "eine GCN-Schicht, 512 Einheiten, PReLU (transduktiv)"
    lr: 0.001
    early_stopping: "Trainingsloss, Geduld 20"
    classifier: "logistische Regression auf den Einbettungen"
    applies_to: "transduktive Einstellung (nicht die induktiven Angaben)"
  shchur_pitfalls_2018:   # GCN
    feature_norm: "Merkmale NICHT normalisiert"
    lr: 0.01
    weight_decay: "L2 1e-3"
    dropout: 0.8
    hidden: 64
    early_stopping: "Geduld 50, Gesamt-Validierungsloss"
  shchur_gat_2018:
    feature_norm: "Merkmale NICHT normalisiert"
    lr: 0.01
    weight_decay: "L2 0.01"
    dropout: "0.6 Eingaben, 0.3 Attention"
    hidden: "8 Köpfe x 8 Merkmale (Hidden 64 gesamt, nicht 64 je Kopf)"
    early_stopping: "Geduld 50, Gesamt-Validierungsloss"
  zeng_dlinear_2023:
    input_length: 336
    lr: 0.005
    lr_schedule: "type1, pro Epoche halbiert"
    batch_size: 32
    epochs: 10
    patience: 3
  zeng_nlinear_2023:
    method: "letzten Wert des Fensters abziehen und wieder addieren"
    input_length: 336
    lr: 0.005
    lr_schedule: "type1, pro Epoche halbiert"
    batch_size: 32
    epochs: 10
    patience: 3

